# Settings for this website's SEO agent. The tools in this kit are the same for every site;
# only this file, PROMPT.md and the *.default/*.template files differ.
SITE_NAME="Skill & Mix"
DEFAULT_HOME="$HOME/.seo-agent"
DEFAULT_SITE_URL="https://skillandmix.com"
DEFAULT_PAYLOAD_URL="https://admin.skillandmix.com"
BE_HEALTH_PATH="/api/globals/site-settings"
BE_REMOTE="sm-be"
CRON_TAG="skillandmix-seo-agent"
# Nightly run time, Vietnam time
CRON_VN_HOUR=2
CRON_MINUTE=30
# Our pages the competitor report compares against (paths on the site, or full URLs)
OUR_PAGES="/ /courses /courses/bartender-co-ban /courses/mot-kem-mot /courses/bartender-nang-cao"
# Which pages of a competitor's sitemap are worth studying (words in the URL)
TOPIC_STRONG="bartender"
TOPIC_MEDIUM="cocktail|mixology|flair|ruou"
TOPIC_EXCLUDE="latte|barista|tra-sua|matcha|cafe|ca-phe|banh|sua-dau"
# What the agent's CMS account needs (shown by install.sh)
CMS_ROLE_HELP="Roles: create \"SEO Agent\" with Read on everything, Create+Update on News, Update on Courses, Home page, Courses page, About page, and Read on Media. Nothing on Users/Roles. Users: create user \"SEO Agent\" with that role, tick \"Enable API Key\", save, copy the key."
